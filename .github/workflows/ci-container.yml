name: CampusPilot CI and Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-server.txt
            requirements-torch-cpu.txt
            requirements-app.txt
            requirements-persistence.txt
      - name: Enforce public repository boundary
        run: python scripts/check_public_repository.py
      - run: |
          pip install -r requirements-torch-cpu.txt
          pip install -r requirements-server.txt
      - name: Run deployment-critical tests
        run: >-
          python -m unittest
          tests.test_campuspilot_api
          tests.test_campuspilot_conversation_graph
          tests.test_handbook_qa
          tests.test_campuspilot
          tests.test_campuspilot_domain_core
          tests.test_admission_mvp
          tests.test_release_scope

  container:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
